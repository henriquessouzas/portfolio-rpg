<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme flash prevention: logic mirrors resolveTheme() in src/lib/theme.ts -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf1dc" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = '#1a1426';
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henrique Santos de Souza | Portfólio RPG</title>
    <meta name="description" content="Explore o castelo de Henrique Santos de Souza: habilidades, projetos e histórias em um portfólio RPG interativo." />
    <meta property="og:title" content="Henrique Santos de Souza | Portfólio RPG" />
    <meta property="og:description" content="Uma jornada de código e criatividade. Descubra as cinco salas deste portfólio interativo." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Source+Sans+3:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
