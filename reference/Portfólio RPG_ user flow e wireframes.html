<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfólio RPG — user flow e wireframes</title>
<style>
:root{--bg:#f6f7fb;--ink:#14172b;--mute:#5b607a;--line:#cfd3e6;--panel:#fff;--acc:#3b3fd9;--accbg:#e8e9fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1120;--ink:#eceeff;--mute:#9aa0c4;--line:#2f3459;--panel:#171a33;--acc:#8e92ff;--accbg:#1f2347}}
:root[data-theme="dark"]{--bg:#0f1120;--ink:#eceeff;--mute:#9aa0c4;--line:#2f3459;--panel:#171a33;--acc:#8e92ff;--accbg:#1f2347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:40px 20px}
h1{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;margin:0 0 8px}
h2{font-size:1.4rem;margin:48px 0 12px}
p{margin:0;color:var(--mute);max-width:40em}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
svg{display:block;width:100%;height:auto}
svg text{font:12px system-ui,sans-serif;fill:var(--ink)}
svg .h{font-weight:600;font-size:13px}
.n{fill:var(--accbg);stroke:var(--acc);stroke-width:1}
.fr{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.gy{fill:var(--bg);stroke:var(--mute);stroke-width:1}
.ln{stroke:var(--mute);stroke-width:1.2;fill:none}
.ds{stroke:var(--acc);stroke-width:1.4;stroke-dasharray:4 3;fill:none}
.hero{fill:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
figcaption{margin-top:8px;font-size:.95rem;color:var(--mute)}
figcaption b{color:var(--ink)}
figure{margin:0}
</style>
</head>
<body>
<main>
<h1>Portfólio RPG</h1>
<p>User flow e wireframes de baixa fidelidade. O círculo azul é o herói; linhas tracejadas mostram o caminho dele.</p>

<h2>User flow</h2>
<div class="box">
<svg viewBox="0 0 680 320" role="img" aria-label="User flow do portfólio: tela inicial, aproximação, mapa, herói caminha, sala, objeto, painel e volta ao mapa">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<g class="n"><rect x="40" y="30" width="120" height="48" rx="6"/><rect x="200" y="30" width="120" height="48" rx="6"/><rect x="360" y="30" width="120" height="48" rx="6"/><rect x="520" y="30" width="120" height="48" rx="6"/>
<rect x="520" y="130" width="120" height="48" rx="6"/><rect x="360" y="130" width="120" height="48" rx="6"/><rect x="200" y="130" width="120" height="48" rx="6"/><rect x="40" y="130" width="120" height="48" rx="6"/></g>
<rect class="gy" x="40" y="230" width="120" height="48" rx="6"/>
<g text-anchor="middle" dominant-baseline="central">
<text class="h" x="100" y="46">Tela inicial</text><text x="100" y="64">Castelo em 2D</text>
<text class="h" x="260" y="46">Aproximação</text><text x="260" y="64">Clique no castelo</text>
<text class="h" x="420" y="46">Mapa</text><text x="420" y="64">Grid com 5 salas</text>
<text class="h" x="580" y="46">Herói anda</text><text x="580" y="64">Segue o clique</text>
<text class="h" x="580" y="146">Sala aberta</text><text x="580" y="164">Zoom na sala</text>
<text class="h" x="420" y="146">Objeto</text><text x="420" y="164">Clique para interagir</text>
<text class="h" x="260" y="146">Painel</text><text x="260" y="164">Detalhes e links</text>
<text class="h" x="100" y="146">Voltar</text><text x="100" y="164">Retorna ao mapa</text>
<text class="h" x="100" y="246">Versão simples</text><text x="100" y="264">Pular o jogo</text>
</g>
<g class="ln" marker-end="url(#a)"><path d="M162 54H198" marker-end="url(#a)"/><path d="M322 54H358" marker-end="url(#a)"/><path d="M482 54H518" marker-end="url(#a)"/><path d="M580 80V128" marker-end="url(#a)"/><path d="M518 154H482" marker-end="url(#a)"/><path d="M358 154H322" marker-end="url(#a)"/><path d="M198 154H162" marker-end="url(#a)"/><path d="M40 54H20V254H38" marker-end="url(#a)"/></g>
<text x="200" y="210">Depois de voltar ao mapa, a pessoa escolhe outra sala.</text>
</svg>
</div>

<h2>Wireframes</h2>
<div class="grid">

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe da tela inicial com castelo">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<line class="ln" x1="1" y1="160" x2="319" y2="160"/>
<rect class="gy" x="60" y="70" width="40" height="90"/><rect class="gy" x="220" y="70" width="40" height="90"/><rect class="gy" x="100" y="50" width="120" height="110"/>
<rect class="n" x="145" y="110" width="30" height="50"/>
<text class="h" x="14" y="26">Meu nome</text>
<rect class="gy" x="222" y="12" width="88" height="22" rx="4"/><text x="266" y="27" text-anchor="middle">Pular o jogo</text>
<text x="160" y="185" text-anchor="middle">Clique no castelo para entrar</text>
</svg></div><figcaption><b>1. Tela inicial.</b> Castelo em 2D, nome e atalho para a versão simples.</figcaption></figure>

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe do mapa do castelo">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<g class="gy"><rect x="18" y="20" width="92" height="50" rx="4"/><rect x="114" y="20" width="92" height="50" rx="4"/><rect x="210" y="20" width="92" height="50" rx="4"/><rect x="18" y="80" width="92" height="50" rx="4"/><rect x="210" y="80" width="92" height="50" rx="4"/><rect x="114" y="145" width="92" height="36" rx="4"/></g>
<rect class="n" x="114" y="80" width="92" height="50" rx="4"/>
<g text-anchor="middle"><text x="64" y="49">Biblioteca</text><text x="160" y="49">Sala do trono</text><text x="256" y="49">Aposentos</text><text x="64" y="109">Arsenal</text><text x="160" y="109">Pátio</text><text x="256" y="109">Laboratório</text></g>
<text x="170" y="167">Entrada</text>
<circle class="hero" cx="135" cy="163" r="6"/>
<path class="ds" d="M135 156V138H64V132"/>
<text x="160" y="194" text-anchor="middle">Clique numa sala: o herói anda até ela</text>
</svg></div><figcaption><b>2. Mapa do castelo.</b> Grid com as cinco salas, o pátio central e a entrada.</figcaption></figure>

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe da sala do arsenal">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<text class="h" x="14" y="22">Arsenal</text>
<g class="n"><rect x="14" y="36" width="64" height="40" rx="4"/><rect x="88" y="36" width="64" height="40" rx="4"/><rect x="162" y="36" width="64" height="40" rx="4"/><rect x="236" y="36" width="64" height="40" rx="4"/></g>
<g text-anchor="middle"><text x="46" y="60">Espada</text><text x="120" y="60">Arco</text><text x="194" y="60">Escudo</text><text x="268" y="60">Bigorna</text></g>
<rect class="gy" x="88" y="110" width="218" height="56" rx="4"/>
<text x="197" y="134" text-anchor="middle">Painel do objeto</text><text x="197" y="152" text-anchor="middle">Nível, projetos e GitHub</text>
<circle class="hero" cx="40" cy="150" r="6"/><path class="ds" d="M40 143L46 80"/>
<rect class="gy" x="14" y="174" width="70" height="18" rx="4"/><text x="49" y="187" text-anchor="middle">← Voltar</text>
</svg></div><figcaption><b>3. Arsenal.</b> Habilidades e stack como armas; cada objeto abre um painel.</figcaption></figure>

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe do laboratório">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<text class="h" x="14" y="22">Laboratório</text>
<g class="n"><rect x="14" y="36" width="92" height="46" rx="4"/><rect x="114" y="36" width="92" height="46" rx="4"/><rect x="214" y="36" width="92" height="46" rx="4"/></g>
<g text-anchor="middle"><text x="60" y="55">Poção 1</text><text x="60" y="71">status e stack</text><text x="160" y="55">Poção 2</text><text x="160" y="71">status e stack</text><text x="260" y="55">Poção 3</text><text x="260" y="71">status e stack</text></g>
<rect class="gy" x="114" y="110" width="192" height="56" rx="4"/>
<text x="210" y="134" text-anchor="middle">Painel do projeto</text><text x="210" y="152" text-anchor="middle">Progresso, stack e repositório</text>
<circle class="hero" cx="40" cy="150" r="6"/><path class="ds" d="M40 143L56 86"/>
<rect class="gy" x="14" y="174" width="70" height="18" rx="4"/><text x="49" y="187" text-anchor="middle">← Voltar</text>
</svg></div><figcaption><b>4. Laboratório.</b> Projetos em andamento como poções, cada uma com status e stack.</figcaption></figure>

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe da biblioteca">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<text class="h" x="14" y="22">Biblioteca</text>
<g class="n"><rect x="14" y="36" width="92" height="46" rx="4"/><rect x="114" y="36" width="92" height="46" rx="4"/><rect x="214" y="36" width="92" height="46" rx="4"/></g>
<g text-anchor="middle"><text x="60" y="55">Cursos</text><text x="60" y="71">estudos</text><text x="160" y="55">Certificados</text><text x="160" y="71">conquistas</text><text x="260" y="55">Projetos</text><text x="260" y="71">concluídos</text></g>
<rect class="gy" x="114" y="110" width="192" height="56" rx="4"/>
<text x="210" y="134" text-anchor="middle">Livro aberto</text><text x="210" y="152" text-anchor="middle">Resumo, tecnologias e links</text>
<circle class="hero" cx="40" cy="150" r="6"/><path class="ds" d="M40 143L56 86"/>
<rect class="gy" x="14" y="174" width="70" height="18" rx="4"/><text x="49" y="187" text-anchor="middle">← Voltar</text>
</svg></div><figcaption><b>5. Biblioteca.</b> Conhecimentos e projetos concluídos em estantes.</figcaption></figure>

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe dos aposentos">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<text class="h" x="14" y="22">Aposentos</text>
<g class="n"><rect x="14" y="36" width="64" height="40" rx="4"/><rect x="88" y="36" width="64" height="40" rx="4"/><rect x="162" y="36" width="64" height="40" rx="4"/><rect x="236" y="36" width="64" height="40" rx="4"/></g>
<g text-anchor="middle"><text x="46" y="60">Cama</text><text x="120" y="60">Mesa</text><text x="194" y="60">Pôster</text><text x="268" y="60">Baú</text></g>
<rect class="gy" x="88" y="110" width="218" height="56" rx="4"/>
<text x="197" y="134" text-anchor="middle">Painel pessoal</text><text x="197" y="152" text-anchor="middle">Hobbies, gostos e setup</text>
<circle class="hero" cx="40" cy="150" r="6"/><path class="ds" d="M40 143L46 80"/>
<rect class="gy" x="14" y="174" width="70" height="18" rx="4"/><text x="49" y="187" text-anchor="middle">← Voltar</text>
</svg></div><figcaption><b>6. Aposentos.</b> O lado pessoal: curiosidades, hobbies e setup.</figcaption></figure>

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe da sala do trono">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<text class="h" x="14" y="22">Sala do trono</text>
<rect class="n" x="125" y="36" width="70" height="70" rx="6"/><text x="160" y="52" text-anchor="middle">Trono</text>
<circle class="hero" cx="160" cy="84" r="7"/>
<rect class="gy" x="14" y="56" width="84" height="40" rx="4"/><text x="56" y="73" text-anchor="middle">Pergaminho</text><text x="56" y="88" text-anchor="middle">história</text>
<rect class="gy" x="222" y="56" width="84" height="40" rx="4"/><text x="264" y="73" text-anchor="middle">Troféus</text><text x="264" y="88" text-anchor="middle">destaques</text>
<rect class="gy" x="125" y="130" width="70" height="36" rx="4"/><text x="160" y="146" text-anchor="middle">Mensageiro</text><text x="160" y="160" text-anchor="middle">contato</text>
<rect class="gy" x="14" y="174" width="70" height="18" rx="4"/><text x="49" y="187" text-anchor="middle">← Voltar</text>
</svg></div><figcaption><b>7. Sala do trono.</b> O herói senta no trono; história, destaques e contato ficam em volta.</figcaption></figure>

<figure><div class="box"><svg viewBox="0 0 320 200" role="img" aria-label="Wireframe da versão simples">
<rect class="fr" x="1" y="1" width="318" height="198" rx="6"/>
<text class="h" x="14" y="26">Meu nome</text>
<rect class="gy" x="214" y="10" width="92" height="20" rx="4"/><text x="260" y="24" text-anchor="middle">Voltar ao jogo</text>
<g class="gy"><rect x="14" y="40" width="292" height="22" rx="4"/><rect x="14" y="66" width="292" height="22" rx="4"/><rect x="14" y="92" width="292" height="22" rx="4"/><rect x="14" y="118" width="292" height="22" rx="4"/><rect x="14" y="144" width="292" height="22" rx="4"/></g>
<text x="22" y="55">Arsenal: habilidades</text><text x="22" y="81">Laboratório: em andamento</text><text x="22" y="107">Biblioteca: estudos e projetos</text><text x="22" y="133">Aposentos: sobre mim</text><text x="22" y="159">Trono: história e contato</text>
<text x="160" y="186" text-anchor="middle">Mesmo conteúdo, sem o jogo</text>
</svg></div><figcaption><b>8. Versão simples.</b> Atalho para recrutadores e para quem prefere acessibilidade.</figcaption></figure>

</div>
</main>
</body>
</html>
